gamma: 0.99
max_horizon: 8
token_dim: null  # set per env
obs_dim: null
act_dim: null
model:
  model_dim: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.0
diffusion:
  num_steps: 1000
  beta_schedule: cosine
  loss_weight: uniform
training:
  steps_per_horizon: 100000
  batch_size: 256
  lr: 3.0e-4
  ema_decay: 0.995
  ema_update_every: 10
  ema_update_after: 1000
  log_freq: 1000
  save_freq: 10000
  replay_buffer_size: 50000
  replay_refresh_size: 256
  replay_refresh_freq: 5000
eval:
  n_trajectories: 1000
  n_mc_episodes: 100
seed: 42
device: cuda
